services:
  - type: web
    name: localmove-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_GOOGLE_MAPS_API_KEY
        value: AIzaSyBbyqtpPJXKzeeCMjM1uTU1m1IWxli0eeg
      - key: CORS_ORIGIN
        value: "*"
